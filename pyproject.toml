[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-play-predictor"
version = "0.1.0"
description = "Live NFL play-type and outcome prediction"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "nflreadpy",
    "polars",
    "scikit-learn",
    "xgboost",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
markers = [
    "network: tests that hit external network resources (deselect with -m \"not network\")",
]
